<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Face Security Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top,
                #17345c,
                #07111f 45%,
                #02060b);

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dashboard {
            width: 90%;
            max-width: 800px;

            padding: 45px;

            border-radius: 25px;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.15);

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.5);

            text-align: center;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .success {
            color: #00ff88;
            font-size: 20px;
            margin-bottom: 35px;
        }

        .card-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            width: 200px;
            padding: 25px;

            border-radius: 18px;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.1);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .status {
            color: #00ff88;
        }

        button {
            margin-top: 35px;

            padding: 13px 30px;

            border: none;
            border-radius: 10px;

            background: #00ff88;
            color: #001b0e;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

    </style>

</head>

<body>

    <div class="dashboard">

        <div class="icon">
            🔐
        </div>

        <h1>FACE SECURITY</h1>

        <div class="success">
            ✓ FACE VERIFIED SUCCESSFULLY
        </div>

        <div class="card-container">

            <div class="card">
                <h3>User</h3>
                <p>Dinesh</p>
            </div>

            <div class="card">
                <h3>Status</h3>
                <p class="status">Authenticated</p>
            </div>

            <div class="card">
                <h3>Security</h3>
                <p class="status">Active</p>
            </div>

        </div>

        <button onclick="logout()">
            Logout
        </button>

    </div>

    <script>

        function logout() {

            window.location.href = "/";

        }

    </script>

</body>

</html>
